name: Scrape Caesars

on:
  schedule:
    # Pacific Time 6:00 AM, year-round. GitHub cron is UTC-only with no DST,
    # so we register both UTC times and skip whichever doesn't match the
    # current Pacific offset.
    - cron: '0 13 * * *'  # 6am PT in PDT (UTC-7) — Mar–Nov
    - cron: '0 14 * * *'  # 6am PT in PST (UTC-8) — Nov–Mar
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Skip if not the active DST cron
        id: dst
        run: |
          PT_OFFSET=$(TZ=America/Los_Angeles date +%z)
          SCHEDULE="${{ github.event.schedule }}"
          case "$SCHEDULE" in
            "0 13 * * *") REQ="-0700" ;;  # PDT cron
            "0 14 * * *") REQ="-0800" ;;  # PST cron
            *)            REQ="" ;;        # workflow_dispatch — always run
          esac
          if [ -z "$REQ" ] || [ "$PT_OFFSET" = "$REQ" ]; then
            echo "Pacific offset $PT_OFFSET matches cron $SCHEDULE — running."
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "Pacific offset is $PT_OFFSET, cron $SCHEDULE expects $REQ — skipping."
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.dst.outputs.run == 'true'

      - name: Setup Python
        if: steps.dst.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Caesars uses undetected-chromedriver + xvfb (headful) — the engine that
      # got past Imperva from a datacenter IP Apr 6–15. camoufox/Playwright-FF
      # crashes in CI on Caesars' page errors, and plain Selenium has no stealth.
      - name: Install dependencies
        if: steps.dst.outputs.run == 'true'
        run: pip install undetected-chromedriver selenium supabase python-dotenv

      # uc 3.5.5 can't drive the runner's bleeding-edge Chrome (149) — it ran
      # clean on 147. Pin a matched Chrome-for-Testing 147 + chromedriver.
      - name: Install pinned Chrome 147 + xvfb
        if: steps.dst.outputs.run == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          JSON=https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json
          BUILD=$(curl -s "$JSON" | jq -c '[.versions[] | select(.version|startswith("147."))] | last')
          CHROME_URL=$(echo "$BUILD" | jq -r '.downloads.chrome[]       | select(.platform=="linux64") | .url')
          DRIVER_URL=$(echo "$BUILD" | jq -r '.downloads.chromedriver[] | select(.platform=="linux64") | .url')
          VER=$(echo "$BUILD" | jq -r '.version' | cut -d. -f1)
          echo "Pinning Chrome $(echo "$BUILD" | jq -r .version)"
          curl -sSL "$CHROME_URL"  -o /tmp/chrome.zip  && unzip -q /tmp/chrome.zip  -d /tmp
          curl -sSL "$DRIVER_URL" -o /tmp/driver.zip && unzip -q /tmp/driver.zip -d /tmp
          CHROME_BIN=/tmp/chrome-linux64/chrome
          DRIVER_BIN=/tmp/chromedriver-linux64/chromedriver
          chmod +x "$CHROME_BIN" "$DRIVER_BIN"
          echo "CHROME_BIN=$CHROME_BIN"           >> $GITHUB_ENV
          echo "CHROMEDRIVER_BIN=$DRIVER_BIN"      >> $GITHUB_ENV
          echo "CHROME_VERSION=$VER"               >> $GITHUB_ENV
          "$CHROME_BIN" --version || true

      - name: Run Caesars scraper
        if: steps.dst.outputs.run == 'true'
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CAESARS_USERNAME: ${{ secrets.CAESARS_USERNAME }}
          CAESARS_PASSWORD: ${{ secrets.CAESARS_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: xvfb-run --auto-servernum python scrape_caesars.py

      - name: Upload debug screenshots
        if: always() && steps.dst.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-caesars
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
