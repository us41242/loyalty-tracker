name: Scrape Caesars

on:
  schedule:
    # Pacific Time 6:00 AM, year-round. GitHub cron is UTC-only with no DST,
    # so we register both UTC times and skip whichever doesn't match the
    # current Pacific offset.
    - cron: '0 13 * * *'  # 6am PT in PDT (UTC-7) — Mar–Nov
    - cron: '0 14 * * *'  # 6am PT in PST (UTC-8) — Nov–Mar
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Skip if not the active DST cron
        id: dst
        run: |
          PT_OFFSET=$(TZ=America/Los_Angeles date +%z)
          SCHEDULE="${{ github.event.schedule }}"
          case "$SCHEDULE" in
            "0 13 * * *") REQ="-0700" ;;  # PDT cron
            "0 14 * * *") REQ="-0800" ;;  # PST cron
            *)            REQ="" ;;        # workflow_dispatch — always run
          esac
          if [ -z "$REQ" ] || [ "$PT_OFFSET" = "$REQ" ]; then
            echo "Pacific offset $PT_OFFSET matches cron $SCHEDULE — running."
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "Pacific offset is $PT_OFFSET, cron $SCHEDULE expects $REQ — skipping."
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.dst.outputs.run == 'true'

      - name: Setup Python
        if: steps.dst.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Caesars uses the Chrome (undetected-chromedriver + xvfb) engine — NOT
      # camoufox. The Playwright-Firefox driver crashes on Caesars' uncaught
      # page errors in CI (pageError.location.url TypeError); Chrome does not.
      - name: Install dependencies
        if: steps.dst.outputs.run == 'true'
        run: pip install selenium webdriver-manager supabase python-dotenv

      - name: Install Chrome + xvfb
        if: steps.dst.outputs.run == 'true'
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb xvfb
          google-chrome-stable --version

      - name: Detect Chrome version
        if: steps.dst.outputs.run == 'true'
        run: |
          CHROME_VERSION=$(google-chrome-stable --version | grep -oP '\d+' | head -1)
          echo "CHROME_VERSION=$CHROME_VERSION" >> $GITHUB_ENV
          echo "Detected Chrome version: $CHROME_VERSION"

      - name: Run Caesars scraper
        if: steps.dst.outputs.run == 'true'
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CAESARS_USERNAME: ${{ secrets.CAESARS_USERNAME }}
          CAESARS_PASSWORD: ${{ secrets.CAESARS_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: xvfb-run --auto-servernum python scrape_caesars.py

      - name: Upload debug screenshots
        if: always() && steps.dst.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-caesars
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
