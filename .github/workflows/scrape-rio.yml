name: Scrape Rio

on:
  schedule:
    # 12:00 AM Pacific = 07:00 UTC (PDT). Drifts 1h in PST.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache camoufox browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-v1

      - name: Fetch camoufox (no-op if cached)
        run: python -m camoufox fetch

      - name: Run Rio scraper
        env:
          CI: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RIO_USERNAME: ${{ secrets.RIO_USERNAME }}
          RIO_PASSWORD: ${{ secrets.RIO_PASSWORD }}
        run: python run.py rio --headless

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-rio
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
